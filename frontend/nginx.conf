server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change, so they can be cached for long.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: unknown paths (/transacoes, /categorias, ...) serve the app.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
