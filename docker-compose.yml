services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      DATABASE_URL: file:/app/data/financy.db
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:4000/graphql', { method: 'POST',
          headers: { 'content-type': 'application/json' }, body: '{"query":"{ __typename }"}' })
          .then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000/graphql}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
